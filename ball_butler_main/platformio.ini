; PlatformIO Project Configuration File
;
; Ball Butler firmware — Teensy 4.x via Teensyduino / Arduino framework.
;
; Layout note: this project keeps the Arduino-style flat layout — `.ino`,
; `.cpp`, and `.h` files live at the root of `ball_butler_main/` rather
; than under `src/`. `src_dir = .` plus a top-level `build_src_filter`
; below tells PIO to compile that flat tree (and skip the `src/`, `lib/`,
; `test/`, `include/` placeholder dirs that `pio project init` creates).
;
; Default target is Teensy 4.1. If the board on the bench is a Teensy
; 4.0, switch to the `teensy40` env (or change `board` below).
;
; Quick reference (run from this directory):
;   pio run                       # build
;   pio run -t upload             # build + flash via the bootloader button
;   pio device monitor            # 115200 baud serial monitor
;
; Host-compat note: on Ubuntu 20.04 hosts (e.g. the Jetson, glibc 2.31)
; the bundled `teensy_size` binary aborts with "GLIBC_2.34 not found",
; which kills `checkprogsize` and blocks the .hex from being produced —
; so `pio run -t upload` would fail. `scripts/fix_teensy_size_glibc.py`
; (wired in via `extra_scripts` below) swaps both invocations for
; `arm-none-eabi-size` from the bundled toolchain, fixing the build on
; those hosts without changing anything on hosts where teensy_size
; already works. See the script header for details.

;
; FLASH OVER CAN (2026-09-28). With the Jugglebot can-bridge running (ROS
; launch DOWN — the bridge is a single-owner UDP link) and Ball Butler in
; IDLE or ERROR:
;
;   pio run -e teensy40_can -t upload
;
; builds firmware.hex and hands it to Jugglebot's tools/teensy_link_bridge.py
; --fw-update --target bb, which streams it through the bridge's BB_FW_* relay
; (CAN1 0x7D6/0x7D7) into FwUpdate.cpp. BB parks itself first (yaw e-stopped,
; pitch raised to >= 80 deg, pitch + hand ODrives IDLE), stages and verifies
; the image, copies it and reboots; the tool prints the FW version before and
; after (FwUpdate.h FW_VERSION — bump it on every flashed change). Needs
; can-bridge FW >= 21 and a BB image that already carries the receiver
; (FW_VERSION >= 1, flashed over USB with the teensy40 env). To rehearse
; without touching the program region (BB reboots ~60 s after VERIFY):
;   $PYTHONEXE ../../Jugglebot/tools/teensy_link_bridge.py \
;       --fw-update .pio/build/teensy40_can/firmware.hex --target bb --verify-only
; USB (the teensy40 env) stays the recovery path.

[platformio]
src_dir = .

[env]
platform = teensy
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-cli

; See script header for the GLIBC_2.34 workaround on older hosts.
extra_scripts =
    post:scripts/fix_teensy_size_glibc.py

; FlexCAN_T4 is not on the PIO registry — pull it directly from GitHub.
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git

; Compile only `.ino`/`.cpp`/`.c` files at the project root. The
; auto-generated `src/`, `lib/`, `test/`, `include/` placeholder
; directories are skipped — they contain only PIO's stock README
; files and would otherwise be walked recursively.
build_src_filter =
    +<*.ino>
    +<*.cpp>
    +<*.c>

[env:teensy41]
board = teensy41

[env:teensy40]
board = teensy40

; Same board and build as teensy40; only the upload differs — over CAN through
; the can-bridge instead of USB (see "FLASH OVER CAN" in the header). $SOURCE
; is the built firmware.hex; $PYTHONEXE is the interpreter running pio (the
; PDJ venv, which has the tool's dependencies).
[env:teensy40_can]
board = teensy40
upload_protocol = custom
upload_command = $PYTHONEXE "$PROJECT_DIR/../../Jugglebot/tools/teensy_link_bridge.py" --fw-update $SOURCE --target bb
