; PlatformIO Project Configuration File
;
; Ball Butler firmware — Teensy 4.x via Teensyduino / Arduino framework.
;
; Layout note: this project keeps the Arduino-style flat layout — `.ino`,
; `.cpp`, and `.h` files live at the root of `ball_butler_main/` rather
; than under `src/`. `src_dir = .` plus a top-level `build_src_filter`
; below tells PIO to compile that flat tree (and skip the `src/`, `lib/`,
; `test/`, `include/` placeholder dirs that `pio project init` creates).
;
; Default target is Teensy 4.1. If the board on the bench is a Teensy
; 4.0, switch to the `teensy40` env (or change `board` below).
;
; Quick reference (run from this directory):
;   pio run                       # build
;   pio run -t upload             # build + flash via the bootloader button
;   pio device monitor            # 115200 baud serial monitor
;
; Note: on Ubuntu 20.04 hosts (e.g. the Jetson, glibc 2.31), the
; post-link `teensy_size` reporter fails with "GLIBC_2.34 not found"
; — but the build itself is fine and `firmware.elf` is produced in
; `.pio/build/<env>/`. Flash from a host with glibc ≥ 2.34, or
; convert the ELF to HEX manually if you need to flash from the
; Jetson: `arm-none-eabi-objcopy -O ihex firmware.elf firmware.hex`
; then `teensy_loader_cli` it.

[platformio]
src_dir = .

[env]
platform = teensy
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-cli

; FlexCAN_T4 is not on the PIO registry — pull it directly from GitHub.
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git

; Compile only `.ino`/`.cpp`/`.c` files at the project root. The
; auto-generated `src/`, `lib/`, `test/`, `include/` placeholder
; directories are skipped — they contain only PIO's stock README
; files and would otherwise be walked recursively.
build_src_filter =
    +<*.ino>
    +<*.cpp>
    +<*.c>

[env:teensy41]
board = teensy41

[env:teensy40]
board = teensy40
